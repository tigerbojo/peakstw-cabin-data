name: 測試

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # 解析器測試只用 tests/fixtures 裡存下來的官網 HTML，不連網路、不需要瀏覽器
      - run: python -m pytest tests -q
